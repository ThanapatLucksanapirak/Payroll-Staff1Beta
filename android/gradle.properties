org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── What the app opens ───────────────────────────────────────────────────────
# The kiosk's own hostname (KIOSK_HOST on the server). The app only opens this
# site, full screen, and only if https://<kioskHost>/.well-known/assetlinks.json
# lists this app's signing key (see android/README.md).
kioskHost=kioskpayroll.shijirigroup.com
# Play Store identity. The package name can never change once the app is on Play.
appId=com.shijirigroup.timeclock
appName=Time Clock
# Bump versionCode by 1 for every upload to Play (the CI workflow can set it).
versionCode=1
versionName=1.0.0
