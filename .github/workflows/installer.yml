name: Installer checks
on:
  pull_request:
    paths: ["deploy/**", ".github/workflows/installer.yml"]
  push:
    branches: [main]
    paths: ["deploy/**"]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -S warning deploy/install.sh deploy/payroll deploy/lib/*.sh
      - name: Syntax check
        run: for f in deploy/install.sh deploy/payroll deploy/lib/*.sh; do bash -n "$f"; done
